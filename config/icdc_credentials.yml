---
environment:
  development:
    compute:
      url: https://compute-dev.zby.icdc.io
      login: admin
      password: <%= ENV['COMPUTE_PASSWORD'] %>
      token: <%= ENV['COMPUTE_TOKEN'] %>
  production:
    compute:
      url: https://compute.<%= ENV['LOC_NAME'] %>.icdc.io
      login: admin
      password: <%= ENV['COMPUTE_PASSWORD'] %>
      token: <%= ENV['COMPUTE_TOKEN'] %>
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch('RAILS_MAX_THREADS') { 5 } %>
  host: <%= ENV.fetch('DATABASE_HOST') %>
  post: <%= ENV.fetch('DATABASE_PORT') { 5432 } %>
  username: <%= ENV.fetch('DATABASE_USER') %>
  password: <%= ENV.fetch('DATABASE_PASSWORD') %>
development:
  !!merge <<: *default 
  database: <%= ENV.fetch('DATABASE_NAME') { 'traefik_manager_api_development' } %>
test:
  !!merge <<: *default 
  database: <%= ENV.fetch('DATABASE_NAME') { 'traefik_manager_api_test' } %>
production:
  !!merge <<: *default 
  database: <%= ENV.fetch('DATABASE_NAME') { 'traefik_manager_api_production' } %>

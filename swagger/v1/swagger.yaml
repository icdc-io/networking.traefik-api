---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/cloudgw":
    get:
      summary: list gateways
      responses:
        '200':
          description: successful
    post:
      summary: create gateway
      responses:
        '200':
          description: successful
  "/api/v1/cloudgw/{id}":
    parameters:
    - name: id
      in: path
      description: id
      required: true
      schema:
        type: string
    get:
      summary: show gateway
      responses:
        '200':
          description: successful
    delete:
      summary: delete gateway
      responses:
        '200':
          description: successful
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: www.example.com

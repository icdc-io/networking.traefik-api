components:
  securitySchemes:
    JWT:
      type: openIdConnect
      openIdConnectUrl: https://login.icdc.io/auth/realms/master/.well-known/openid-configuration
    basicAuth:
      type: http
      scheme: basic
    Account:
      type: apiKey
      in: header
      #TODO: [DS] rename to x-auth-account
      name: x-icdc-account
    Role:
      type: apiKey
      in: header
      #TODO: [DS] rename to x-auth-role
      name: x-icdc-role
    CloudGatewayUUID:
      type: apiKey
      in: path
      name: UUID

  schemas:
    error:
      type: object
      required:
        - status
        - data
      properties:
        status:
          # TODO: may be use integer for status
          type: integer
          example: 500
          description: HTTP code
          readOnly: true
        data:
          type: object
          properties:
            message:
              type: string
              example: Server error
              description: Error message description. Shown in UI as is, so make sure it understandable by ordinary user.
              readOnly: true
    GatewayCollection:
      type: array
      items:
        $ref: "#/components/schemas/Gateway"
    Gateway:
      type: object
      required:
        - name
        - cloudgw_id
      properties:
        id:
          type: string
          example: 1234
          readOnly: true
        name:
          type: string
          example: vpn-default
          description: |
            Name of gateway. No real technical restriction on names Validate: alphanumeric/dash/underscore
        cloudgw_id:
          type: string
          example: a843bf2a-7dac-4256-b048-cc1bc0864ccb
          description: |
            UUID of CloudGateway VM on which traefik is deployed.
            Stored in field 'uuid' in database.
        cloudgw_instance:
          type: string
          example: cloudgw-a843bf2a
          readOnly: true
          description: |
            Calculated field: cloudgw-<short_cloudgw_id> shows on which VM this VPN gateway is running
        account:
          type: string
          example: devel
          description: |
            Account the ALB Gateway is attached
        created_at:
          type: string
          example: "2023-10-23T12:00:00.136Z"
          description: Timestamp object created
        updated_at:
          type: string
          example: "2023-11-23T18:00:01.555Z"
          description: Timestamp object updated
    Gateway_PUT:
      type: object
      properties:
        name:
          type: string
          example: alb-special
        account:
          type: string
          example: devel
    GatewayConfig:
      type: string
      description: Traefik YAML config
      example: |
        http:
          routers:
            SERVICE-http:
              entryPoints:
              - web
              service: SERVICE
              middlewares: SERVICE-redirect
              rule: Host(`SERVICE.LOC.icdc.io`)
            SERVICE-https:
              entryPoints:
              - websecure
              service: SERVICE
              rule: Host(`SERVICE.LOC.icdc.io`)
              tls:
                certResolver: default
          middlewares:
            SERVICE-redirect:
              redirectscheme:
                scheme: https
          services:
            SERVICE:
              loadBalancer:
                servers:
                - url: http://10.254.20.10
        tcp: {}
        tls: {}
    CertificateCollection:
      type: array
      items:
        $ref: "#/components/schemas/Certificate"
    Certificate:
      type: object
      required:
        - cert_path
        - key_path
        - ca_path
        - dest_ca_path
        - values
      properties:
        id:
          type: integer
          example: 5
        cert_path:
          type: string
          example: test_acc1
        key_path:
          type: string
          example: test
        ca_path:
          type: string
          example:
        dest_ca_path:
          type: string
          example: test
        owner:
          type: string
          example: user@test.email
        name:
          type: string
          example: lb.computedev.loc.icdc.io
        values:
          type: object
          properties:

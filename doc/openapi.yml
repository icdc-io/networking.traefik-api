          type: string
          example: ""
        dest_ca:
          type: string
          example: ""
        owner:
          type: string
          example: user@test.email
    ServiceCollection:
      type: array
      items:
        $ref: "#/components/schemas/Service"
    Service:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Clone#59"
        ext_id:
          type: string
          example: "26000000000113"
        ipaddresses:
          type: string
          example: "10.254.20.65,fe80::f1d6:c354:43f5:b643"
        owner:
          type: string
          example: "user@test.email"
        account:
          type: string
          example: "icdc"
    RouteCollection:
      type: array
      items:
        $ref: "#/components/schemas/Route"
    Route:
      type: object
      properties:
        id:
          type: integer
          example: 1
          readOnly: true
        name:
          type: string
          example: Route
        hostname:
          type: string
          example: test.loc.icdc.io
        path:
          type: string
          example: /
        target_port:
          type: integer
          example: 6587
        insecure:
          type: string
          example: None
        tls_termination:
          type: string
          example: Edge
        labels:
          type: string
          example: KV
        cloud_gateway_id:
          type: integer
          example: 1
        certificate_id:
          type: integer
          example: 1
        source_proto:
          type: string
          example: tcp
        destination_proto:
          type: string
          example: tcp
        ip_version:
          type: integer
          example: 4
        owner:
          type: string
          example: user@test.email
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        healthcheck_enabled:
          type: boolean
          example: true
        healthcheck:
          type: object
          properties:
            path:
              type: string
              example: "/"
            scheme:
              type: string
              example: https
            hostname:
              type: string
              example: check-cors.loc.icdc.io
            port:
              type: integer
              example: 8080
            interval:
              type: integer
              example: 15
            timeout:
              type: integer
              example: 3
            headers:
              type: string
              example: { "x-icdc-account": "devel", "x-icdc-role": "admin" }
            method:
              type: string
              example: POST
            follow_redirects:
              type: boolean
              example: true
  responses:
    apigw_not_allowed:
      description: This API gateway error means selected operation is not supported
      content:
        application/json:
          schema:
            type: string
          example: "405 method not allowed"
    server_error:
      description: Server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error"
          example:
            status: 500
            message: Unexpected server-side error
            data:
              message: Unexpected server-side error

    unauthorized:
      description: >
        Request is not authorized, usually because of:
        bad credentials, expired JWT token, account role is not assigned to authenticated user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error"
          example:
            status: 401
            message: You're not authorized.
            data:
              message: You're not authorized.
    forbidden:
      description: >
        Request authorized, but current user doesn't have access rights to perform action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error"
          example:
            status: 403
            message: You're doesn't have permissions to perform the action.
            data:
              message: You're doesn't have permissions to perform the action.
    not_found:
      description: >
        Requested object is not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error"
          example:
            status: 404
              #TODO: [DS] maybe rename message as bad request is a 400 code, means that object attributes are malformed or can not be applied
            message: Bad request, not found {object}
            data:
              message: Bad request, not found {object}
    unprocessable_entity:
      description: >
        Unprocessable entity.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error"
          example:
            status: 422
            message: Bad request, unprocessable entity
            data:
              message: Bad request, unprocessable entity
    alb_list:
      description: A list of ALB Gateways attached to account's infrastructure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayCollection"
  parameters:
    Account:
      name: x-icdc-account
      in: header
      description: Name of the account (5-character string)
      required: true
      schema:
        type: string
        example: acc
    Role:
      name: x-icdc-role
      in: header
      description: Role name
      required: true
      schema:
        type: string
        example: admin
    CloudGatewayId:
      name: uuid
      description: |
        Used for simplified authorization for some internal requests from CloudGateway to config.
      in: path
      required: true
      schema:
        type: string
        example: a843bf2a-7353-563e-a220-f59949849dba

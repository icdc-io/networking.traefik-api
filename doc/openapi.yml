    delete:
      operationId: certificate_delete
      tags:
        - Certificates
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      summary: Delete certificate
      description: >
        The endpoint is called to delete a certificate from the system.

        Role-based access:
          - `operator` role can manage all certificates in location
          - `admin`/`owner` role can manage all certificates in account
          - `member` role can manage only own certificates
      parameters:
        - name: id
          in: path
          description: Unique ID of certificate
          required: true
          schema:
            type: integer
            example: 333
      responses:
        "204":
          description: No content
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/not_found"
        "500":
          $ref: "#/components/responses/server_error"

      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X DELETE \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "x-icdc-account: $ACCOUNT" \
              -H "x-icdc-role: $ROLE" \
              https://api.loc.icdc.io/api/traefik_manager/v1/certificates/{id}
  /services:
    get:
      operationId: services_list
      tags:
        - Services
      summary: Show all existing certificates
      description: >
        This endpoint is called to retrieve the list of services along with information about VMs' IP addresses.
        It is typically used for fetching the service_id when users create routes using the API.
        The information is synchronized with the Compute application automatically every 15 minutes.

        Role-based access:
          - `operator` role can see all services in the location
          - `admin`/`owner` role can see all services in account
          - `member` role can see only own services
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCollection"
        "401":
          $ref: "#/components/responses/unauthorized"
        "500":
          $ref: "#/components/responses/server_error"

      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "x-icdc-account: $ACCOUNT" \
              -H "x-icdc-role: $ROLE" \
              https://api.loc.icdc.io/api/traefik_manager/v1/services
  /routes:
    get:
      operationId: routes_list
      tags:
        - Routes
      summary: Get info about existing routes
      description: >
        Role-based access:
          - `operator` role can see all routes in the location
          - `admin`/`owner` role can see all routes in account
          - `member` role can see only own routes
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteCollection"
        "401":
          $ref: "#/components/responses/unauthorized"
        "500":
          $ref: "#/components/responses/server_error"
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "x-icdc-account: $ACCOUNT" \
              -H "x-icdc-role: $ROLE" \
              https://api.loc.icdc.io/api/traefik_manager/v1/routes
    post:
      operationId: route_create
      tags:
        - Routes
      summary: Create a new route
      description: >
        Role-based access:
          - `operator` role can create routes in any account per location
          - `admin`/`owner` role can create route only in the account space
          - `member` role can create route only in the account space
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Route"
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "401":
          $ref: "#/components/responses/unauthorized"
        "422":
          $ref: "#/components/responses/unprocessable_entity"
        "500":
          $ref: "#/components/responses/server_error"

      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "x-icdc-account: $ACCOUNT" \
              -H "x-icdc-role: $ROLE" \
              -d '{
                "route": {
                  "name": "route_name",
                  "hostname": "acc.vpn.loc.icdc.io",
                  "target_port": "443",
                  "tls_termination": "re-encrypt",
                  "owner": " user@example.com",
                  "cloud_gateway_id": "1",
                  "path": "/",

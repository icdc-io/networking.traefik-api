openapi: 3.0.0
info:
  version: '1.0'
  title: ICDC Traefik Manager API
  description: Traefik Manager provide multi-tenant Traefik HTTP provider API to pull dynamic configuration by traefik loadbalancers installed in Account's CloudGWs.
  contact:
    email: compute@icdc.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
tags:
  - name: Gateways
    description: Gateways management
  - name: Certificates
    description: Basic info about db certificates
  - name: Routes
    description: Routes
  - name: Services
    description: Compute Services
paths:
  /gateways:
    get:
      tags:
        - 'Gateways'
      summary: List of account's Traefik Gateways
      security:
        - JWT: [admin]
      parameters: 
        - $ref: '#/components/parameters/Account'
      responses:
        '200':
          description: 'Operation successfull'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayCollection'
    post:
      tags:
        - 'Gateways'
      summary: Create a new Traefik Gateway (Register)
      security:
        - JWT: [location_admin]
      description: >
        This endpoint is called from CloudGateway Automation only.
        So we are not going to provide ability to Account Admins to create new gateways
      parameters: 
        - $ref: '#/components/parameters/Account'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: vpn-default
                cloudgw_id:
                  type: string
                  example: a843bf2a-7353-563e-a220-f59949849dba
                account:
                  type: string
                  example: icdc
      responses:
        '201':
          description: 'Created successful'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway'
  /gateways/{id}:
    get:
      tags:
        - 'Gateways'
      summary: Show a gateway details
      security:
        - JWT: [admin]
      parameters:
        - $ref: '#/components/parameters/Account'
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1234
      responses:
        '200':
          description: 'Operation successful'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway'
    put:
      tags:
        - 'Gateways'
      summary: Update Traefik Gateway. Usually use to assign Traefik Gateway to account.
      security:
        - JWT: [admin]
      parameters:
        - $ref: '#/components/parameters/Account'
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1234
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: New Traefik Name
      responses:
        '200':
          description: 'Operation successful'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway'
    delete:
      tags:
        - 'Gateways'
      summary: Remove Traefik Gateway (un-register)
      security:
        - JWT: [location_admin]
      description: >
        This endpoint is called from CloudGateway Automation only.
        So we are not going to provide ability to Account Admins to delete gateways
      parameters:
      - $ref: '#/components/parameters/Account'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          example: 1234
      responses:
        '204':
          description: 'No content'
  /gateways/{uuid}/config:
    get:
      tags:
        - 'Gateways'
      summary: Return YAML config for Traefik Gateway
      security:
        - UUID: [cloud_gateway_id]
      parameters:
        - $ref: '#/components/parameters/CloudGatewayId'
      responses:
        '200':
          description: 'Operation successful'
          content:
            text/yaml:
              schema:
                $ref: '#/components/schemas/GatewayConfig'
  '/api/certificates':
    get:
      tags:
        - Certificates
      summary: Show all certificates
      responses:
        '200':
          description: operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateCollection'
    post:
      tags:
        - Certificates
      summary: Create a new certificate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                certificate:

  '/api/v1/services':
    get:
      tags:
        - Service
      summary: Show all existing certificates
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCollection'
  '/api/routes':
    get:
      tags:
        - Routes
      summary: Get info about existing routes
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteCollection'
    post:
      tags:
        - Routes
      summary: Create a new route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                route:
                  type: object
                  properties:
                    name:
                      type: string
                      example: 'miq-api'
                    hostname:
                      type: string
                      example: 'miq.computedev.zby.icdc.io'
                    target_port:
                      type: integer
                      example: 3000
                    tls_termination:
                      type: string
                      example: 'passthrough'
                    owner:
                      type: string
                      example: 'ahrechushkin@ibagroup.eu'
                    cloud_gateway_id:
                      type: integer
                      example: 1
                    path:
                      type: string
                      example: '/'
                    source_proto:
                      type: string
                      example: 'tcp'
                    destination_proto:
                      type: string
                      example: 'tcp'
                    ip_version:
                      type: integer
                      example: 4
                    services:
                      type: array
                      items:
                        properties:
                          id:
                            type: string
                            example: 61
                    certificate_id:
                      type: integer
                      example: 6
                    insecure:
                      type: string
                      example: 'none'
                    healthcheck_enabled:
                      type: boolean
                      example: true
                    healthcheck:
                      type: object
                      properties:
                        path:
                          type: string
                          example: '/'
                        scheme:
                          type: string
                          example: https
                        hostname:
                          type: string
                          example: check-cors.zby.icdc.io
                        port:
                          type: integer
                          example: 8080
                        interval:
                          type: integer
                          example: 15
                        headers:
                          type: string
                          example: {'x-icdc-account': 'devel', 'x-icdc-role': 'admin'}
                        method:
                          type: string
                          example: POST
                        follow_redirect:
                          type: boolean
                          example: true
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
  '/api/routes/{id}':
    get:
      tags:
        - Routes
      summary: Show info about selected route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
    put:
      tags:
        - Routes
      summary: Add routes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                route:
                  type: object
                  properties:
                    name:
                      type: string
                      example: 'miq-api'
                    hostname:
                      type: string
                      example: 'miq.computedev.zby.icdc.io'
                    target_port:
                      type: integer
                      example: 3000
                    tls_termination:
                      type: string
                      example: 'passthrough'
                    owner:
                      type: string
                      example: 'ahrechushkin@ibagroup.eu'
                    cloud_gateway_id:
                      type: integer
                      example: 1
                    path:
                      type: string
                      example: '/'
                    source_proto:
                      type: string
                      example: 'tcp'
                    destination_proto:
                      type: string
                      example: 'tcp'
                    ip_version:
                      type: integer
                      example: 4
                    services:
                      type: array
                      items:
                        properties:
                          id:
                            type: string
                            example: 61
                    certificate_id:
                      type: integer
                      example: 6
                    insecure:
                      type: string
                      example: 'none'
                    healthcheck_enabled:
                      type: boolean
                      example: true
                    healthcheck:
                      type: object
                      properties:
                        path:
                          type: string
                          example: '/'
                        scheme:
                          type: string
                          example: https
                        hostname:
                          type: string
                          example: check-cors.zby.icdc.io
                        port:
                          type: integer
                          example: 8080
                        interval:
                          type: integer
                          example: 15
                        headers:
                          type: string
                          example: {'x-icdc-account': 'devel', 'x-icdc-role': 'admin'}
                        method:
                          type: string
                          example: POST
                        follow_redirect:
                          type: boolean
                          example: true                      
      responses:
        '200':
          description: 'Operation successful'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route' 
    delete:
      tags:
        - Routes
      summary: Delete route
      parameters:
        - name: id
          in: path
          description: Unique ID of route
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No content
components:
  schemas:
    GatewayCollection:
      type: array
      items:
        $ref: '#/components/schemas/Gateway'
    Gateway:
      type: object
      required:
        - name
        - cloudgw_id
      properties:
        id:
          type: integer
          example: 1234
          readOnly: true
        name:
          type: string
          example: vpn-default
          description: |
            Name of gateway. No real technical restriction on names Validate: alphanumeric/dash/underscore
        cloudgw_id:
          type: string
          example: a843bf2a-7dac-4256-b048-cc1bc0864ccb
          description: |
            UUID of CloudGateway VM on which traefik is deployed.
            Stored in field 'uuid' in database.
        cloudgw_instance:
          type: string
          example: cloudgw-a843bf2a
          readOnly: true
          description: |
            Calculated field: cloudgw-<short_cloudgw_id> shows on which VM this VPN gateway is running
        account:
          type: string
          example: devel
          description: |
            Account which manages Traefik Gateway
    GatewayConfig:
      type: string
      description: Traefik YAML config
      example: |
        http:
          routers:
            SERVICE-http:
              entryPoints:
              - web
              service: SERVICE
              middlewares: SERVICE-redirect
              rule: Host(`SERVICE.LOC.icdc.io`)
            SERVICE-https:
              entryPoints:
              - websecure
              service: SERVICE
              rule: Host(`SERVICE.LOC.icdc.io`)
              tls:
                certResolver: default
          middlewares:
            SERVICE-redirect:
              redirectscheme:
                scheme: https
          services:
            SERVICE:
              loadBalancer:
                servers:
                - url: http://10.254.20.10
        tcp: {}
        tls: {}  
    CertificateCollection:
      type: array
      items:
        $ref: '#/components/schemas/Certificate'
    Certificate:
      type: object
      required:
        - cert_path
        - key_path
        - ca_path
        - dest_ca_path
        - values
      properties:
        id:
          type: integer
          example: 5
        cert_path:
          type: string
          example: test_acc1
        key_path:
          type: string
          example: test
        ca_path:
          type: string
          example: 
        dest_ca_path:
          type: string
          example: test
        owner:
          type: string
          example: ahrechushkin@ibagroup.eu
        name:

            ca:
              type: string
              example: ""
            dest_ca:
              type: string
              example: ""
            hostnames:
              type: array
              items:
                example: "miq.computedev.zby.icdc.io"
            valid_from:
              type: string
              example: "2021-10-28T11:52:15.000Z"
            valid_until:
              type: string
              example: "2031-10-26T11:52:15.000Z"
            issuer:
              type: string
              example: "Default Company Ltd"
    ServiceCollection:
      type: array
      items:
        $ref: '#/components/schemas/Service'
    Service:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Clone#59"
        ext_id:
          type: string
          example: "26000000000113"
        ipaddresses:
          type: string
          example: "10.254.20.65,fe80::f1d6:c354:43f5:b643"
        owner:
          type: string
          example: "ahrechushkin@ibagroup.eu"
        account:
          type: string
          example: "icdc"
    RouteCollection:
      type: array
      items:
        $ref: '#/components/schemas/Route'
    Route:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Route
        hostname:
          type: string
          example: test.zby.icdc.io
        path:
          type: string
          example: /
        terget_port:
          type: integer
          example: 6587
        insecure:
          type: string
          example: None
        tls_termination:
          type: string
          example: Edge
        labels:
          type: string
          example: KV
        cloud_gateway_id:
          type: integer
          example: 1
        certificate_id:
          type: integer
          example: 1
        source_proto:
          type: string
          example: tcp
        destination_proto:
          type: string
          example: tcp
        ip_version:
          type: integer
          example: 4
        owner:
          type: string
          example: ahrechushkin@ibagroup.eu
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        healthcheck_enabled:
          type: boolean
          example: true
        healthcheck:
          type: object
          properties:
            path:
              type: string
              example: '/'
            scheme:
              type: string
              example: https
            hostname:
              type: string
              example: check-cors.zby.icdc.io
            port:
              type: integer
              example: 8080
            interval:
              type: integer
              example: 15
            headers:
              type: string
              example: {'x-icdc-account': 'devel', 'x-icdc-role': 'admin'}
            method:
              type: string
              example: POST
            follow_redirect:
              type: boolean
              example: true            
  parameters:
    Account:
      name: x-icdc-account
      in: header
      description: Name of the account (5-character string)
      required: true
      schema:
        type: string
        example: acc
    Role:
      name: x-icdc-role
      in: header
      description: Role name
      required: true
      schema:
        type: string
        example: admin
    CloudGatewayId:
      name: uuid
      description: |
        Used for simplified authorization for some internal requests from CloudGateway to config.
      in: path
      required: true
      schema:
        type: string
        example: a843bf2a-7353-563e-a220-f59949849dba
  security:
    - JWT:
      - member
      - manager
      - billing
      - admin
      - location_admin
    - UUID:
      - cloud_gateway_id

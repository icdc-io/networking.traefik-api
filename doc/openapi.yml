  '/api/certificates/{id}':
    get:
      tags:
        - Certificates
      summary: Show certificate record
      parameters:
        - name: id
          in: path
          description: Unique ID of certificate
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
    put:
      tags:
        - Certificates
      summary: update cert
      parameters:
        - name: id
          in: path
          description: Unique ID of certificate
          required: true
          schema:
            type: integer
      requestBody:
        required: true

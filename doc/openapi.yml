  /certificates/{id}:
    get:
      operationId: certificate_show
      tags:
        - Certificates
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      summary: Show certificate record
      description: >
        This endpoint is used to explore the details of a certificate.

        Role-based access:
          - `operator` role can see all certificates in location
          - `admin`/`owner` role can see all certificates in account
          - `member` role can see only own certificates
      parameters:
        - name: id
          in: path
          description: Unique ID of certificate
          required: true
          schema:
            type: integer
            example: 333
      responses:
        "200":
          description: operation successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/not_found"
        "500":
          $ref: "#/components/responses/server_error"

      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "x-icdc-account: $ACCOUNT" \
              -H "x-icdc-role: $ROLE" \
              https://api.loc.icdc.io/api/traefik_manager/v1/certificates/{id}
    put:
      operationId: certificate_update
      tags:
        - Certificates
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      summary: update cert
      description: >
        The endpoint is called for updating a certificate.
        The server automatically checks the validity of the updated certificate.
        After the certificate has been successfully updated via the API, CloudGateway Automation automatically downloads and applies it to a route defined in the hostnames field.

        Role-based access:
          - `operator` role can manage all certificates in location
          - `admin`/`owner` role can manage all certificates in account
          - `member` role can manage only own certificates
      parameters:
        - name: id
          in: path
          description: Unique ID of certificate
          required: true
          schema:
            type: integer
            example: 333
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Certificate_POST"
      responses:
        "200":
          description: operation successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
        "422":
          $ref: "#/components/responses/unprocessable_entity"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/not_found"
        "500":
          $ref: "#/components/responses/server_error"


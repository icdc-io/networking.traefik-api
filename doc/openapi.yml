openapi: 3.0.0
info:
  version: "1.0"
  title: ICDC Appication LoadBalancer API1
  description: >
    # Introduction

    The `Traefik Manager` subsystem provides easy HTTP API to manage **Application LoadBalancer** functionality of ICDC Cloud Platform.

    Using this API you can script the complex actions that are required for your business case.

    The API documentation starting from general overview and followed by reference information on specific endpoints.

    ## Application LoadBalancer

    **Application LoadBalancer (ALB)** is a technology based on OpenSource `Traefik` reverse-proxy.

    This functionality allows to accept HTTP and HTTPS traffic coming to public IP address on ports 80/tcp and 443/tcp, differentiate requests by target website hostname and send requests to specific virtual machine or group of virtual machines located in `Instance Group` (previously named as `Service`) of *ICDC Compute*.


    In case of using multiple virtual machines in the `Instance Group` by default all requests are balanced by round-robin algorithm:
      - first request goes to first instance;
      - second request goes to second instance;
      - so on until we reach end of the list of the `Instance Group` then starting again with the first instance.

    By default requests are sent to all members of `Instance Group` until health-check configured, then requests are sent only to live members of `Instance Group` (ALB actively monitors liveness of target ports).

    ## Web-routes

    **Web-route** is a rule created on ALB which defines what hostname traffic should be accepted and what target webservers and port the public traffic should be routed to.

    Web-routes can have overlap hostnames as far they have different `/path` specified.
    Also web-routes defines health-check rules to find live members of `Instance Group`.

    ## Cloud Gateways

    **Application LoadBalancer** software installed on an instance of **CloudGateway** which is a special-purposed small multi-functional virtual machine attached to account's network.

    By default each organizational account has at least one `Cloud Gateway`.
  contact:
    email: support@icdc.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - description: Public URL
    url: https://api.{loc}.icdc.io/api/traefik_manager/v1
    variables:
      loc:
        default: dcz
        description: 3-letter code of location
  - description: Location-local URL
    url: http://traefik.cloud-networking.svc:3000/api/v1
  - description: Local development URL
    url: http://localhost:3000/api/v1
tags:
  - name: ALB Gateways
    description: >
      **Application LoadBalancer** functionality allows to configure accepting of public HTTP traffic from internet and sending it to webservers or applications hosted on virtual machines. So in terms of networking it works as gateway for public web traffic to your account workloads.
      ALB Gateway is hosted on special-purposed managed virtual machines, **CloudGateway** instances.
      Sending requests to the `/gateways` endpoint, you can list account's ALB, retrieve details or update configuration of specific ALB.
  - name: Certificates
    description: >
      **Certificates** allow to secure communication to the website and allows to terminate (decrypt) HTTPS traffic on ALB Gateway and then send to un-encrypted port on the VM (`edge` termination) or encrypted port on the VM (`re-encrypt` termination).
      Long-term certificates for your domains can be purchased from vendors.
      Sending requests to the `/certificates` endpoint, you can list uploaded certificates, upload new one or delete.
  - name: Routes
    description: >
      **Routes** enable the creation of public HTTP routes for sites or web applications deployed on virtual machines.
      Routes also facilitate TLS termination, health checks, and load balancing between **Instance Groups (Services)** using weights.
      Sending requests to the /routes endpoint, you can list created routes, retrieve details, update existing ones, or create new routes.
  - name: Services
    description: >
      The **Services** functionality enables users to view configurations of owned services/instance groups deployed within the Compute application.
      Sending requests to the /services endpoint, you can list owned services.
paths:
  /gateways:
    get:
      operationId: alb_list
      tags:
        - ALB Gateways
      summary: List of ALB Gateways
      description: >
        By sending request to this endpoint you can get list of ALB Gateways which are currently attached to account network infrastructure (VPC).

        Role-based access:
          - `admin` role in`operator` account see all gateways of all accounts
          - `admin`/`owner`, `member` roles see gateways in attached to account
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      responses:
        "200":
          $ref: "#/components/responses/alb_list"
        "401":
          $ref: "#/components/responses/unauthorized"
        "500":
          $ref: "#/components/responses/server_error"
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "x-icdc-account: $ACCOUNT" \
              -H "x-icdc-role: $ROLE" \
              https://api.$LOC.icdc.io/api/traefik_manager/v1/gateways
              
        - lang: Python
          source: |-
            import requests

            url = "https://api.{loc}.icdc.io/api/traefik_manager/v1/gateways"
            headers = {
                "Content-Type": "application/json",
                "Authorization": f"Bearer {TOKEN}",
                "x-icdc-account": ACCOUNT,
                "x-icdc-role": ROLE
            }

            response = requests.get(url, headers=headers)
            print(response.json())

        - lang: JavaScript (Axios)
          source: |-
            const axios = require('axios');

            const url = `https://api.${LOC}.icdc.io/api/traefik_manager/v1/gateways`;

            axios.get(url, {
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${TOKEN}`,
                    'x-icdc-account': ACCOUNT,
                    'x-icdc-role': ROLE
                }
            })
            .then(response => {
                console.log(response.data);
            })
            .catch(error => {
                console.error(error);
            });

        - lang: Node.js (HTTPS)
          source: |-
            const https = require('https');

            const options = {
              hostname: `api.${LOC}.icdc.io`,
              path: '/api/traefik_manager/v1/gateways',
              method: 'GET',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${TOKEN}`,
                'x-icdc-account': ACCOUNT,
                'x-icdc-role': ROLE
              }
            };

            const req = https.request(options, (res) => {
              let data = '';

              res.on('data', (chunk) => {
                data += chunk;
              });

              res.on('end', () => {
                console.log(JSON.parse(data));
              });
            });

            req.on('error', (error) => {
              console.error(error);
            });

            req.end();

        - lang: Go
          source: |-
            package main

            import (
                "fmt"
                "net/http"
                "io/ioutil"
            )

            func main() {
                url := "https://api.{loc}.icdc.io/api/traefik_manager/v1/gateways"

                req, _ := http.NewRequest("GET", url, nil)
                req.Header.Add("Content-Type", "application/json")
                req.Header.Add("Authorization", "Bearer "+TOKEN)
                req.Header.Add("x-icdc-account", ACCOUNT)
                req.Header.Add("x-icdc-role", ROLE)

                client := &http.Client{}
                resp, err := client.Do(req)
                if err != nil {
                    fmt.Println(err)
                    return
                }
                defer resp.Body.Close()

                body, _ := ioutil.ReadAll(resp.Body)
                fmt.Println(string(body))
            }

        - lang: Ruby
          source: |-
            require 'net/http'
            require 'uri'
            require 'json'

            uri = URI.parse("https://api.#{LOC}.icdc.io/api/traefik_manager/v1/gateways")
            request = Net::HTTP::Get.new(uri)
            request["Content-Type"] = "application/json"
            request["Authorization"] = "Bearer #{TOKEN}"
            request["x-icdc-account"] = ACCOUNT
            request["x-icdc-role"] = ROLE

            response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
              http.request(request)
            end

            puts response.body

        - lang: Java
          source: |-
            import java.io.BufferedReader;
            import java.io.InputStreamReader;
            import java.net.HttpURLConnection;
            import java.net.URL;

            public class Main {
                public static void main(String[] args) {
                    try {
                        String url = "https://api." + LOC + ".icdc.io/api/traefik_manager/v1/gateways";
                        URL obj = new URL(url);
                        HttpURLConnection con = (HttpURLConnection) obj.openConnection();

                        con.setRequestMethod("GET");
                        con.setRequestProperty("Content-Type", "application/json");
                        con.setRequestProperty("Authorization", "Bearer " + TOKEN);
                        con.setRequestProperty("x-icdc-account", ACCOUNT);
                        con.setRequestProperty("x-icdc-role", ROLE);

                        int responseCode = con.getResponseCode();
                        BufferedReader in = new BufferedReader(new InputStreamReader(con.getInputStream()));
                        String inputLine;
                        StringBuilder response = new StringBuilder();

                        while ((inputLine = in.readLine()) != null) {
                            response.append(inputLine);
                        }
                        in.close();

                        System.out.println(response.toString());
                    } catch (Exception e) {
                        e.printStackTrace();
                    }
                }
            }
    post:
      operationId: alb_attach
      tags:
        - ALB Gateways
        - Private
      summary: Attach new ALB Gateway to account infrastructure
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      description: >
        This endpoint is called from CloudGateway Automation only.
        So we are not going to provide ability to Account Admins to create new gateways

        Role-based access:
          - `operator` role can send requests to the endpoint
          - other roles does have to access the endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: alb-default
                cloudgw_id:
                  type: string
                  example: a843bf2a-7353-563e-a220-f59949849dba
                account:
                  type: string
                  example: acc
      responses:
        "200":
          $ref: "#/components/responses/alb_list"
        "401":
          $ref: "#/components/responses/unauthorized"
        "405":
          $ref: "#/components/responses/apigw_not_allowed"
        "422":
          $ref: "#/components/responses/unprocessable_entity"
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "x-icdc-account: $OPERATOR" \
              -H "x-icdc-role: admin" \
              -d '{"account":"acc", "name": "alb-default", "cloudgw_id": "a843bf2a-7353-563e-a220-f59949849dba"}' \
              https://api.loc.icdc.io/api/traefik_manager/v1/gateways
  /gateways/{id}:
    get:
      operationId: alb_show
      tags:
        - ALB Gateways
      summary: Display ALB gateway details
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      description: >
        Role-based access:
          - `admin` role in`operator` account see all gateways of all accounts
          - `admin`/`owner`, `member` roles see gateways in attached to account

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1234
      responses:
        "200":
          description: "Operation successful"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gateway"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/not_found"
        "500":
          $ref: "#/components/responses/server_error"
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "x-icdc-account: $ACCOUNT" \
              -H "x-icdc-role: $ROLE" \
              https://api.loc.icdc.io/api/traefik_manager/v1/gateways/{id}

    put:
      operationId: alb_modify
      tags:
        - ALB Gateways
        - Private
      summary: Update Traefik Gateway. Usually use to assign Traefik Gateway to account.
      description: >
        Role-based access:
          - `operator` role can send requests to the endpoint
          - other roles does have to access the endpoint
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1234
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Gateway_PUT"
      responses:
        "200":
          description: "Operation successful"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gateway"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/not_found"
        "422":
          $ref: "#/components/responses/unprocessable_entity"
        "500":
          $ref: "#/components/responses/server_error"

      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X PUT \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "x-icdc-account: $OPERATOR" \
              -H "x-icdc-role: admin" \
              -d '{"account":"devel", "name": "alb-special"}' \
              https://api.loc.icdc.io/api/traefik_manager/v1/gateways/{id}
    delete:
      operationId: alb_unregister
      tags:
        - ALB Gateways
        - Private
      summary: Remove Traefik Gateway (un-register)
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      description: >
        This endpoint is called from CloudGateway Automation only.
        So we are not going to provide ability to Account Admins to delete gateways

        Role-based access:
          - `operator` role can send requests to the endpoint
          - other roles does have to access the endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1234
      responses:
        "204":
          description: "No content"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/not_found"
        "500":
          $ref: "#/components/responses/server_error"
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X DELETE \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "x-icdc-account: $OPERATOR" \
              -H "x-icdc-role: admin" \
              https://api.loc.icdc.io/api/traefik_manager/v1/gateways/{id}
  /gateways/{uuid}/config:
    get:
      tags:
        - ALB Gateways
        - Private
      summary: Return YAML config for Traefik Gateway
      description: >
        This endpoint is called from CloudGateway Automation only.
        So we are not going to provide ability to Account Admins to see a Gateway Config
      parameters:
        - $ref: "#/components/parameters/CloudGatewayId"
      responses:
        "200":
          description: "Operation successful"
          content:
            text/yaml:
              schema:
                $ref: "#/components/schemas/GatewayConfig"
        "404":
          $ref: "#/components/responses/not_found"
        "500":
          $ref: "#components/responses/server_error"
  /certificates:
    get:
      operationId: certificates_list
      tags:
        - Certificates
      summary: List of certificates attached to an account gateways
      description: >
        This endpoint is called to retrieve the list of certificates attached to an account's gateways.

        Role-based access:
          - `operator` role can see all certificates in location
          - `admin`/`owner` role can see all certificates in account
          - `member` role can see only own certificates
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      responses:
        "200":
          description: operation successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateCollection"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "500":
          $ref: "#/components/responses/server_error"

      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "x-icdc-account: $ACCOUNT" \
              -H "x-icdc-role: $ROLE" \
              https://api.loc.icdc.io/api/traefik_manager/v1/certificates
    post:
      operationId: certificates_create
      tags:
        - Certificates
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      summary: Create a new certificate
      description: >
        This endpoint is used for creating a new SSL certificate and uploading it to a **CloudGateway**.
        The server automatically checks the validity of the uploaded certificate.
        After the certificate has been successfully uploaded via the API, CloudGateway Automation automatically downloads and applies it to a route defined in the hostnames field.

        Role-based access:
          - `operator` role can create certificate in any account per location
          - `admin`/`owner` role can create certificate only in the account space
          - `member` role can create certificate only in the account space
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Certificate_POST"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "422":
          $ref: "#/components/responses/unprocessable_entity"
        "500":
          $ref: "#/components/responses/server_error"

      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "x-icdc-account: $ACCOUNT" \
              -H "x-icdc-role: $ROLE" \

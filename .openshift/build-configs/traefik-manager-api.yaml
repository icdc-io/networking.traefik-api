apiVersion: v1
kind: BuildConfig
metadata:
  creationTimestamp: null
  labels:
    build: traefik-manager-api
  name: traefik-manager-api
spec:
  failedBuildsHistoryLimit: 5
  nodeSelector: {}
  output:
    to:
      kind: ImageStreamTag
      name: traefik-manager-api:latest
  postCommit: {}
  resources: {}
  runPolicy: Serial
  source:
    contextDir: .openshift/images/traefik-manager-api
    git:
      ref: dev
      uri: https://git.zby.icdc.io/icdc/networking/traefik-manager-api.git
    sourceSecret:
      name: os-deploy-idc
    type: Git
  strategy:
    dockerStrategy:
      env:
      - name: RAILS_ENV
        value: development
      - name: BUILD_BRANCH
        value: dev
      - name: GIT_AUTH
        valueFrom:
          secretKeyRef:
            key: GIT_CRED
            name: git-cred
    type: Docker
  successfulBuildsHistoryLimit: 5
  triggers: []
status:
  lastVersion: 0

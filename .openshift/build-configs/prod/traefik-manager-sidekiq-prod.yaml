apiVersion: v1
kind: BuildConfig
metadata:
  creationTimestamp: null
  labels:
    build: traefik-manager-sidekiq-prod
  name: traefik-manager-sidekiq-prod
spec:
  failedBuildsHistoryLimit: 5
  nodeSelector: {}
  output:
    pushSecret:
      name: registry-zby
    to:
      kind: DockerImage
      name: 'registry.zby.icdc.io/icdc/traefik-manager-sidekiq:prod'
  postCommit: {}
  resources: {}
  runPolicy: Serial
  source:
    contextDir: .openshift/images/traefik-manager-sidekiq/prod
    git:
      ref: prod
      uri: https://git.zby.icdc.io/icdc/networking/traefik-manager-api.git
    sourceSecret:
      name: os-deploy-idc
    type: Git
  strategy:
    dockerStrategy:
      env:
      - name: RAILS_ENV
        value: production
      - name: GIT_AUTH
        valueFrom:
          secretKeyRef:
            key: GIT_CRED
            name: git-cred
      from:
        kind: DockerImage
        name: 'registry.zby.icdc.io/icdc/traefik-manager-sidekiq:prod'
      pullSecret:
        name: registry-zby
    type: Docker
  successfulBuildsHistoryLimit: 5
  triggers: []
status:
  lastVersion: 0

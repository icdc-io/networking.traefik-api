apiVersion: v1
kind: DeploymentConfig
metadata:
  annotations:
    openshift.io/generated-by: OpenShiftWebConsole
  creationTimestamp: null
  generation: 1
  labels:
    app: traefik-manager
  name: traefik-manager-api
spec:
  replicas: 1
  selector:
    app: traefik-manager
    deploymentconfig: traefik-manager-api
  strategy:
    activeDeadlineSeconds: 21600
    resources: {}
    rollingParams:
      intervalSeconds: 1
      maxSurge: 25%
      maxUnavailable: 25%
      timeoutSeconds: 600
      updatePeriodSeconds: 1
    type: Rolling
  template:
    metadata:
      annotations:
        openshift.io/generated-by: OpenShiftWebConsole
      creationTimestamp: null
      labels:
        app: traefik-manager
        deploymentconfig: traefik-manager-api
    spec:
      containers:
      - env:
        - name: REDIS_URL
          value: redis://traefik-manager-redis:6379/0
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: database-password
              name: traefik-manager-redis
        - name: DB_HOST
          value: traefik-manager-postgresql
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: database-password
              name: traefik-manager-postgresql
        - name: RAILS_ENV
          value: development
        image: docker-registry.default.svc:5000/icdc-cloud-stage/traefik-manager-api:latest
        imagePullPolicy: Always
        name: traefik-manager-api
        ports:
        - containerPort: 3000
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
  test: false
  triggers:
  - type: ConfigChange
  - imageChangeParams:
      automatic: true
      containerNames:
      - traefik-manager-api
      from:
        kind: ImageStreamTag
        name: traefik-manager-api:latest
        namespace: icdc-cloud-stage
    type: ImageChange
status:
  availableReplicas: 0
  latestVersion: 0
  observedGeneration: 0
  replicas: 0
  unavailableReplicas: 0
  updatedReplicas: 0
